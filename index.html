<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanX News Flash Archive</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa0aa;
    --positive: #3ecf8e;
    --negative: #f2555a;
    --neutral: #8a8f99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .controls input { flex: 1; min-width: 160px; }
  #feed {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
  }
  .day-heading {
    text-align: center;
    color: var(--muted);
    font-size: 11.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin: 22px 0 10px;
  }
  .day-heading:first-child { margin-top: 4px; }
  .item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    scroll-margin-top: 130px;
    position: relative;
  }
  .rank-badge {
    position: absolute;
    bottom: 8px;
    right: 12px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    opacity: 0.65;
  }
  .item-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }
  .symbol {
    font-weight: 600;
    font-size: 13px;
    color: var(--muted);
  }
  .time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .headline { font-size: 15px; font-weight: 600; margin: 2px 0 6px; }
  .summary { font-size: 13.5px; color: #c6c9cf; line-height: 1.45; }
  .meta { margin-top: 8px; display: flex; gap: 10px; align-items: center; font-size: 12.5px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block;
  }
  .dot.positive { background: var(--positive); }
  .dot.negative { background: var(--negative); }
  .dot.neutral, .dot.unknown { background: var(--neutral); }
  #banner {
    display: none;
    max-width: 760px;
    margin: 12px auto 0;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.4;
  }
  #banner.warn {
    display: block;
    background: rgba(242, 85, 90, 0.12);
    border: 1px solid rgba(242, 85, 90, 0.4);
    color: #ffb3b5;
  }
  #banner a { color: inherit; text-decoration: underline; }
  a.headline-link { color: inherit; text-decoration: none; }
  a.headline-link:hover { text-decoration: underline; }
  #status { text-align: center; color: var(--muted); padding: 24px; font-size: 13px; }
  #floatingDate {
    position: fixed;
    top: 128px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 12px;
    padding: 4px 12px;
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
    z-index: 9;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<header>
  <h1>ScanX News Flash Archive</h1>
  <div class="sub" id="subtitle">Loading&hellip;</div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search headline, symbol, summary&hellip;">
    <select id="sentimentFilter">
      <option value="">All sentiment</option>
      <option value="positive">Positive</option>
      <option value="neutral">Neutral</option>
      <option value="negative">Negative</option>
    </select>
    <select id="dateJump">
      <option value="">Jump to date&hellip;</option>
    </select>
  </div>
  <div id="banner"></div>
</header>

<div id="feed"></div>
<div id="status"></div>
<div id="floatingDate"></div>

<script>
// ---- Configure this for your repo ----
const OWNER = "Chinarscanx";
const REPO = "scanx-scraper";
const BRANCH = "main";
const DATA_PATH = "data";
// ---------------------------------------

const IST_OFFSET_MIN = 5 * 60 + 30; // IST = UTC+5:30

const feedEl = document.getElementById("feed");
const statusEl = document.getElementById("status");
const subtitleEl = document.getElementById("subtitle");
const searchEl = document.getElementById("search");
const sentimentEl = document.getElementById("sentimentFilter");
const bannerEl = document.getElementById("banner");
const dateJumpEl = document.getElementById("dateJump");
const floatingDateEl = document.getElementById("floatingDate");

let allItems = [];   // every item, across all day files (loaded eagerly on init)

async function checkSyncStatus() {
  try {
    const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/status.json?t=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) return; // no status.json yet (e.g. before first sync) - fine, just skip

    const st = await res.json();
    const lastAttempt = new Date(st.last_attempt_utc);
    const minsAgo = Math.round((Date.now() - lastAttempt.getTime()) / 60000);
    const whenText = minsAgo < 60 ? `${minsAgo} min ago` : `${Math.round(minsAgo / 60)} hr ago`;

    if (st.status === "auth_expired") {
      bannerEl.className = "warn";
      bannerEl.innerHTML =
        `\u26A0\uFE0F Auth token expired (last attempt ${whenText}). ` +
        `Grab a fresh token from DevTools and update the <code>SCANX_AUTH_TOKEN</code> secret in GitHub, ` +
        `then it'll pick back up automatically on the next 30-min run.`;
    } else if (st.status === "error") {
      bannerEl.className = "warn";
      bannerEl.innerHTML = `\u26A0\uFE0F Last sync failed (${whenText}): ${escapeHtml(st.message || "unknown error")}`;
    } else if (minsAgo > 90) {
      bannerEl.className = "warn";
      bannerEl.innerHTML = `\u26A0\uFE0F No sync attempt in ${whenText} \u2014 check that the GitHub Action is still enabled and scheduled.`;
    } else {
      bannerEl.className = "";
      bannerEl.textContent = "";
    }
  } catch (err) {
    console.warn("Could not check sync status:", err);
  }
}

function dateStrFromFilename(name) {
  const m = name.match(/news-(\d{4}-\d{2}-\d{2})\.jsonl$/);
  return m ? m[1] : null;
}

async function listDayFiles() {
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}?ref=${BRANCH}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not list data files (${res.status})`);
  const files = await res.json();
  return files
    .filter(f => f.name.endsWith(".jsonl"))
    .map(f => ({ name: f.name, download_url: f.download_url, dateStr: dateStrFromFilename(f.name) }))
    .filter(f => f.dateStr)
    .sort((a, b) => b.dateStr.localeCompare(a.dateStr)); // newest first
}

async function fetchDayItems(fileMeta) {
  const res = await fetch(fileMeta.download_url);
  if (!res.ok) return [];
  const text = await res.text();
  return text
    .split("\n")
    .map(l => l.trim())
    .filter(Boolean)
    .map(l => { try { return JSON.parse(l); } catch { return null; } })
    .filter(Boolean);
}

// Prefer the article's real publish date (new schema); fall back to when it
// was scraped, for any leftover records from before the API switch.
function itemTimestampMs(it) {
  return it.publish_date_ms || (it.scraped_at ? new Date(it.scraped_at).getTime() : 0);
}

// IST calendar date (YYYY-MM-DD) for a record.
function istDateStr(it) {
  const ms = itemTimestampMs(it);
  if (!ms) return null;
  const d = new Date(ms + IST_OFFSET_MIN * 60000);
  return d.toISOString().slice(0, 10);
}

function formatDayHeading(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }).toUpperCase();
}

function formatTime(it) {
  const ms = itemTimestampMs(it);
  if (!ms) return "";
  const d = new Date(ms + IST_OFFSET_MIN * 60000);
  const h = d.getUTCHours(), m = d.getUTCMinutes();
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, "0")} ${ampm}`;
}

// Countdown badge per date: newest item of a date = that date's total
// count, oldest = 1. Computed once from the FULL (unfiltered) list per
// date, so the numbers stay stable even while searching/filtering.
let dayRankById = {};
function computeDayRanks() {
  const byDate = {};
  for (const it of allItems) {
    const d = istDateStr(it);
    if (!d) continue;
    (byDate[d] = byDate[d] || []).push(it);
  }
  dayRankById = {};
  for (const d in byDate) {
    const group = byDate[d].slice().sort((a, b) => itemTimestampMs(b) - itemTimestampMs(a));
    const total = group.length;
    group.forEach((it, idx) => { dayRankById[it.id] = total - idx; });
  }
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const sentiment = sentimentEl.value;

  const filtered = allItems.filter(it => {
    if (sentiment && (it.sentiment || "unknown") !== sentiment) return false;
    if (!q) return true;
    const hay = `${it.headline || ""} ${it.symbol || ""} ${it.summary || ""}`.toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => itemTimestampMs(b) - itemTimestampMs(a));

  let html = "";
  let lastDate = null;
  for (const it of filtered) {
    const d = istDateStr(it);
    if (d && d !== lastDate) {
      html += `<div class="day-heading" data-date="${d}">${formatDayHeading(d)}</div>`;
      lastDate = d;
    }
    html += renderItem(it, d);
  }
  feedEl.innerHTML = html;

  subtitleEl.textContent = `${filtered.length} item${filtered.length === 1 ? "" : "s"} shown`;
}

function renderItem(it, dateStr) {
  const sentiment = it.sentiment || "unknown";
  const headlineHtml = it.seo_symbol
    ? `<a class="headline-link" href="https://scanx.trade/stocks/${escapeAttr(it.seo_symbol)}" target="_blank" rel="noopener">${escapeHtml(it.headline)}</a>`
    : escapeHtml(it.headline || "");
  const rank = dayRankById[it.id];

  return `
    <div class="item" data-date="${dateStr || ""}">
      <div class="item-top">
        <span class="symbol">${escapeHtml(it.symbol || "")}</span>
        <span class="time">${formatTime(it)}</span>
      </div>
      <div class="headline">${headlineHtml}</div>
      ${it.summary ? `<div class="summary">${escapeHtml(it.summary)}</div>` : ""}
      <div class="meta">
        <span class="dot ${sentiment}"></span>
        <span style="text-transform:capitalize;color:var(--muted);">${sentiment}</span>
      </div>
      ${rank != null ? `<span class="rank-badge">${rank}</span>` : ""}
    </div>`;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, "&quot;");
}

// ---------- date dropdown (with per-date counts) ----------
function populateDateDropdown() {
  const counts = {};
  for (const it of allItems) {
    const d = istDateStr(it);
    if (d) counts[d] = (counts[d] || 0) + 1;
  }
  const dates = Object.keys(counts).sort().reverse();

  dateJumpEl.innerHTML = `<option value="">Jump to date&hellip;</option>` +
    dates.map(d => `<option value="${d}">${formatDayHeading(d)} (${counts[d]})</option>`).join("");
}

dateJumpEl.addEventListener("change", () => {
  const d = dateJumpEl.value;
  if (!d) return;
  // Clear filters so the target date is guaranteed visible, then scroll to it.
  searchEl.value = "";
  sentimentEl.value = "";
  render();
  requestAnimationFrame(() => {
    const heading = feedEl.querySelector(`.day-heading[data-date="${d}"]`);
    if (heading) heading.scrollIntoView({ block: "start", behavior: "smooth" });
  });
});

// ---------- floating date while scrolling ----------
function updateFloatingDate() {
  const headings = feedEl.querySelectorAll(".day-heading");
  let current = null;
  for (const h of headings) {
    if (h.getBoundingClientRect().top <= 140) current = h;
    else break;
  }
  if (current) {
    floatingDateEl.textContent = current.textContent;
    floatingDateEl.style.display = "block";
  } else {
    floatingDateEl.style.display = "none";
  }
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
window.addEventListener("scroll", debounce(updateFloatingDate, 80));

async function init() {
  try {
    checkSyncStatus();
    setInterval(checkSyncStatus, 5 * 60 * 1000);

    statusEl.textContent = "Loading news archive\u2026";
    const dayFiles = await listDayFiles();
    if (dayFiles.length === 0) {
      statusEl.textContent = "No data files found yet \u2014 check back after the sync has run.";
      subtitleEl.textContent = "";
      return;
    }

    // Load every day file up front - needed for accurate date-dropdown
    // counts, and current volume is small enough that this stays fast.
    for (const fileMeta of dayFiles) {
      const items = await fetchDayItems(fileMeta);
      allItems.push(...items);
      render();
    }

    computeDayRanks();
    populateDateDropdown();
    render();
    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = "Couldn't load the archive: " + err.message;
  }
}

searchEl.addEventListener("input", render);
sentimentEl.addEventListener("change", render);

init();
</script>

</body>
</html>
