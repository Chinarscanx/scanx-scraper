name: Sync ScanX News (on demand)

on:
  workflow_dispatch: {}   # run manually from the Actions tab whenever you want

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements-sync.txt

      - name: Run sync
        env:
          SCANX_AUTH_TOKEN: ${{ secrets.SCANX_AUTH_TOKEN }}
          SCANX_ENTITY_ID: ${{ secrets.SCANX_ENTITY_ID }}
        run: python scraper/sync_scanx_news.py

      - name: Commit and push new data
        run: |
          git config user.name "scanx-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new items - nothing to commit."
          else
            git commit -m "Sync news ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
