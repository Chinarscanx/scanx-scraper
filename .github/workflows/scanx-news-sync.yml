name: Sync ScanX News (on demand)

on:
  schedule:
    - cron: "*/30 * * * *"   # runs automatically every 30 minutes
  workflow_dispatch: {}   # also runnable manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements-sync.txt

      - name: Run sync
        env:
          SCANX_AUTH_TOKEN: ${{ secrets.SCANX_AUTH_TOKEN }}
          SCANX_ENTITY_ID: ${{ secrets.SCANX_ENTITY_ID }}
        run: python scraper/sync_scanx_news.py

      - name: Commit and push status + new data
        if: always()   # commit status.json even if the sync step above failed
        run: |
          git config user.name "scanx-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ status.json counts.json search-index.json
          if git diff --cached --quiet; then
            echo "Nothing changed - nothing to commit."
          else
            git commit -m "Sync news ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
