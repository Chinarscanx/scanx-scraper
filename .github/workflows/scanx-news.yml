name: Scrape ScanX News Flash

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly during
    # high load - that's normal and fine for this use case.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit new data back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape_scanx_news.py

      - name: Commit and push new data
        run: |
          git config user.name "scanx-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new items - nothing to commit."
          else
            git commit -m "Update news data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
